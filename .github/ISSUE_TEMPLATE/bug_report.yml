name: Bug report
description: Report an editor, audit, graph, or accessibility problem.
title: '[Bug] '
body:
  - type: markdown
    attributes:
      value: |
        Describe a reproducible problem in Gateway API Visualizer.
        Issues and attachments may be public. Use synthetic or sanitized manifests;
        never include credentials, private keys, Kubernetes Secrets, or private cluster details.
        A local CRD diagnostic is not a Kubernetes admission or controller-conformance result.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the actual behavior and how it affects your work.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the sample dataset, controls used, and whether changing the audit target matters.
      placeholder: |
        1. Open the workbench.
        2. Select an audit target and insert a sample.
        3. Describe the action that triggers the problem.
    validations:
      required: true
  - type: dropdown
    id: audit-target
    attributes:
      label: Gateway API audit target
      options:
        - '1.3'
        - '1.4'
        - '1.5'
        - '1.6'
        - Other or not applicable
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the app version and commit from the header, browser version, OS, and hosted or local deployment. For accessibility issues, include assistive technology, zoom level, and input method if relevant.
    validations:
      required: true
  - type: textarea
    id: manifest
    attributes:
      label: Minimal sanitized manifest
      description: Optional. Prefer an included sample when it reproduces the issue. Remove sensitive values before pasting.
      render: yaml
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or diagnostic output
      description: Optional. Include exact errors and check every screenshot or log for sensitive data.
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: I removed credentials and sensitive information from the report and all attachments.
          required: true
